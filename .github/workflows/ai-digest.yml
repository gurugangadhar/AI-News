name: Personal AI Engineer Daily Digest

on:
  schedule:
    # Morning Digest: ~05:55 - 06:00 AM IST (00:25 UTC avoids :30 global queue congestion)
    - cron: "25 0 * * *"
    # Evening Digest: ~05:55 - 06:00 PM IST (12:25 UTC avoids :30 global queue congestion)
    - cron: "25 12 * * *"
  workflow_dispatch:
    inputs:
      digest_type:
        description: "Digest run mode"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning
          - evening
          - test
      dry_run:
        description: "Dry run (generate summaries without sending live email)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Restore deduplication state cache
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: ai-digest-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ai-digest-state-${{ runner.os }}-
            ai-digest-state-

      - name: Load custom sources if provided via secret
        if: ${{ env.SOURCES_YAML != '' }}
        env:
          SOURCES_YAML: ${{ secrets.SOURCES_YAML }}
        run: |
          echo "$SOURCES_YAML" | tr -d '\r' | base64 -d > sources.yaml || echo "$SOURCES_YAML" > sources.yaml

      - name: Run AI Engineer Daily Digest
        env:
          # AI Provider Keys
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-1.5-flash' }}

          # Email Delivery
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'Personal AI Digest <onboarding@resend.dev>' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          # SMTP Fallback
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}

          # Schedule & Timezone
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          MORNING_DIGEST_TIME: ${{ vars.MORNING_DIGEST_TIME || '06:00' }}
          EVENING_DIGEST_TIME: ${{ vars.EVENING_DIGEST_TIME || '18:00' }}

          # State & Inputs
          NEWS_SUMMARY_STATE: data/state.json
          INPUT_TYPE: ${{ github.event.inputs.digest_type || 'auto' }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS="--type ${INPUT_TYPE}"
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          python -m src.cli ${ARGS}

      - name: Commit summaries and state archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}
          git add summaries/ data/state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: archive daily digest $(date +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git pull --rebase origin main || true
          git push || true
